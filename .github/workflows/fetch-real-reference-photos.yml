name: Store real reference photos

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/fetch-real-reference-photos.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download real human loc photos
        run: |
          mkdir -p assets
          curl -L --fail --retry 4 --retry-delay 2             "https://images.unsplash.com/photo-1744846895276-1b4646a89893?auto=format&fit=crop&w=1800&q=90"             -o assets/real-hero-locs.jpg

          curl -L --fail --retry 4 --retry-delay 2             "https://mukisalocs.com/cdn/shop/products/WhatsAppImage2020-12-11at8.05.04AM_2048x2048.jpg?v=1607704290"             -o assets/real-loc-repair.jpg

          curl -L --fail --retry 4 --retry-delay 2             "https://lareinasolessentials.com/cdn/shop/files/IMG_4609.jpg?v=1743777435&width=1946"             -o assets/real-fresh-retwist.jpg

          test -s assets/real-hero-locs.jpg
          test -s assets/real-loc-repair.jpg
          test -s assets/real-fresh-retwist.jpg
          file assets/real-hero-locs.jpg assets/real-loc-repair.jpg assets/real-fresh-retwist.jpg

      - name: Commit real photos
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/real-hero-locs.jpg assets/real-loc-repair.jpg assets/real-fresh-retwist.jpg
          git diff --cached --quiet && exit 0
          git commit -m "Store real loc reference photos [skip ci]"
          git push
